name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log
      - name: server tests (two boots, the second checks saving)
        shell: bash
        run: |
          mkdir -p run/testserver && echo "eula=true" > run/testserver/eula.txt
          printf "online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\n" > run/testserver/server.properties
          for boot in 1 2; do
            set -o pipefail
            timeout 600 ./gradlew runTestServer 2>&1 | tee test$boot.log || true
            grep -E "TCARDS-TEST (FAIL|EXCEPTION)|TCARDS-DEBUG" test$boot.log | while IFS= read -r line; do echo "::error::boot $boot: ${line//%/%25}"; done
            grep -E "TCARDS-TEST SUMMARY" test$boot.log | while IFS= read -r line; do echo "::notice::boot $boot: $line"; done
            grep -q "TCARDS-TEST SUMMARY2 pass=[0-9]* fail=0" test$boot.log || { echo "::error::boot $boot did not pass"; grep -E "ERROR|Exception|Caused by" test$boot.log | head -40 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done; exit 1; }
          done
      - name: report build errors
        if: failure()
        shell: bash
        run: |
          grep -E "error:|What went wrong|Could not|Exception|> " build.log 2>/dev/null | grep -v "^\s*at " | head -60 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done
      - uses: actions/upload-artifact@v7
        with:
          name: topnotch-jar
          path: build/libs/
      - name: Release (on tags like v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/topnotch-*.jar
