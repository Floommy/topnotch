name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log
      - name: report build errors
        if: failure()
        shell: bash
        run: |
          grep -E "error:|What went wrong|Could not|Exception|> " build.log | grep -v "^\s*at " | head -60 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done
      - uses: actions/upload-artifact@v7
        with:
          name: topnotch-jar
          path: build/libs/
      - name: Release (on tags like v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/topnotch-*.jar
