plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group
base { archivesName = 'topnotch' }

repositories {
	exclusiveContent {
		forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
		filter { includeGroup 'maven.modrinth' }
	}
}

sourceSets {
	// Tiny API stubs of optional mods (3D Skin Layers) - compiled against, never shipped
	stubs {
		java { srcDir 'src/stubs/java' }
		compileClasspath += sourceSets.main.compileClasspath
	}
}

loom {
	accessWidenerPath = file('src/main/resources/topnotch.accesswidener')
	mods {
		topnotch { sourceSet sourceSets.main }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	compileOnly sourceSets.stubs.output
	compileOnly 'org.jetbrains:annotations:26.0.2'
	compileOnly "maven.modrinth:vivecraft:${project.vivecraft_version}"
}

processResources {
	def version = project.version
	inputs.property 'version', version
	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from('LICENSE') { rename { 'LICENSE_topnotch' } }
	from('licenses')
}
