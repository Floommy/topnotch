plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group
base { archivesName = 'topnotch' }

repositories {
	exclusiveContent {
		forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
		filter { includeGroup 'maven.modrinth' }
	}
}

sourceSets {
	// Headless server tests (not shipped): ./gradlew runTestServer
	testmod {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	accessWidenerPath = file('src/main/resources/topnotch.accesswidener')
	mods {
		topnotch { sourceSet sourceSets.main }
		tcardstest { sourceSet sourceSets.testmod }
	}
	runs {
		testServer {
			server()
			source sourceSets.testmod
			runDir 'run/testserver'
			property 'tcards.ci', '1'
			programArgs '--nogui'
			ideConfigGenerated false
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// API stubs of 3D Skin Layers (optional integration), sources in src/stubs/java - compiled against, never shipped
	compileOnly files('libs/skinlayers-api-stubs.jar')
	compileOnly 'org.jetbrains:annotations:26.0.2'
	compileOnly "maven.modrinth:vivecraft:${project.vivecraft_version}"
}

processResources {
	def version = project.version
	inputs.property 'version', version
	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from('LICENSE') { rename { 'LICENSE_topnotch' } }
	from('licenses')
}
